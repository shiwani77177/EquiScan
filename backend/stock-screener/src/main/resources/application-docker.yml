# Docker profile
# Activates when SPRING_PROFILES_ACTIVE=docker (set in docker-compose)

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
        autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


# Alpha Vantage API
alphavantage:
  api-key: ${ALPHAVANTAGE_API_KEY}
  base-url: https://www.alphavantage.co/query

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.project.stock_screener: INFO
    org.springframework.web: WARN

jwt:
  secret: ${JWT_SECRET:equiscan-jwt-secret-key-2026-change-this-in-production-min-32-chars}
