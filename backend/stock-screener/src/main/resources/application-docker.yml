server:
  port: ${PORT:8080}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  web:
    resources:
      static-locations: file:./static/,classpath:/static/
  mvc:
    static-path-pattern: /**

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

alphavantage:
  api-key: ${ALPHAVANTAGE_API_KEY:demo}
  base-url: https://www.alphavantage.co/query

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.project.stock_screener: INFO
    org.springframework.web: WARN

jwt:
  secret: ${JWT_SECRET:equiscan-jwt-secret-key-2026-change-this-in-production-min-32-chars}

  